[project]
name = "ratehud"
version = "0.1.0"
description = "Live Claude plan usage HUD for the terminal"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["rich>=13.7"]

[project.scripts]
ratehud = "ratehud:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["ratehud"]
